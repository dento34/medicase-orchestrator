[project]
name = "medicase-coded-summary"
version = "0.7.0"
description = "MediCase coded agents (Language, RTSLookup, Summary, Compliance) for UiPath Maestro"
authors = [{ name = "MediCase Orchestrator Team" }]
requires-python = ">=3.11"
dependencies = [
    "uipath>=2.10",
    "pydantic>=2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
