[project]
name = "medicase-coded-agents"
version = "0.2.0"
description = "MediCase coded agents (Language, RTSLookup, Summary, Compliance) for UiPath Maestro"
authors = [{ name = "MediCase Orchestrator Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
